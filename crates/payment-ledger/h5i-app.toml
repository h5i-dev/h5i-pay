# Read by `h5i app` (extract, check, prove, mutate). Run from the repo root:
#   h5i app prove crates/payment-ledger
[extract]
crate = "."
start-from = ["transition", "reads"]
schema = true
include = ["h5i_app_sql"]

[proofs]
# One Lake project for every kernel; the extraction goes to proofs/generated/.
dir = "../../proofs/ledger"

[check]
theorems = [
  "payment_ledger.Theorems.conservation",
  "payment_ledger.Theorems.journal_balanced",
  "payment_ledger.Theorems.no_overdraft",
  "payment_ledger.Theorems.replay_is_noop",
  "payment_ledger.Theorems.replay_needs_debit_right",
  "payment_ledger.Theorems.only_owner_or_operator_debits",
  "payment_ledger.Theorems.transfers_record_operator",
  "payment_ledger.Storage.db_inv",
  # G1: one history entry per account change, naming the caller; only appended.
  "payment_ledger.History.every_change_logged",
  "payment_ledger.History.history_appended",
  # Read plans (`reads`, `LedgerStore::load_for`): the extracted plans are
  # `readsA`, a plan's rows decode to `Snapshot.load`, and `transition` on
  # that gives its whole-tenant result.
  "payment_ledger.Plan.reads_abs",
  "payment_ledger.Schema.decode_load",
  "payment_ledger.Frame.frame",
  "payment_ledger.Frame.load_for_sound",
]

# Bugs the proofs must reject (`h5i app mutate crates/payment-ledger`).
[[mutant]]
name = "self_transfer_allowed"
old = "if t.debit == t.credit {\n        return Err(Error::SameAccount);"
new = "if false {\n        return Err(Error::SameAccount);"

[[mutant]]
name = "overdraft_allowed"
old = "if a.no_overdraft && debits > a.credits {"
new = "if a.no_overdraft && debits > a.credits + 1 {"

[[mutant]]
name = "anyone_may_debit"
old = "is_operator(actor) || a.owner == user_of(actor)"
new = "true"

[[mutant]]
name = "credit_side_short"
old = "let credits = b.credits + t.amount;"
new = "let credits = b.credits + t.amount - 1;"

[[mutant]]
name = "replay_ignores_amount"
old = "old.debit == t.debit && old.credit == t.credit && old.amount == t.amount && old.code == t.code"
new = "old.debit == t.debit && old.credit == t.credit && old.code == t.code"

[[mutant]]
name = "transfer_plan_misses_credit_account"
old = "p_or(p_eq(ACCOUNT_ID, v_int(t.debit)), p_eq(ACCOUNT_ID, v_int(t.credit)))"
new = "p_or(p_eq(ACCOUNT_ID, v_int(t.debit)), p_eq(ACCOUNT_ID, v_int(t.debit)))"

[[mutant]]
name = "user_accounts_plan_wrong_column"
old = "pub const ACCOUNT_OWNER: u32 = 1;"
new = "pub const ACCOUNT_OWNER: u32 = 2;"

[[mutant]]
name = "replay_answers_anyone"
old = "            if !may_debit(actor, &a) {\n                Err(Error::Forbidden)\n            } else {\n                match find_transfer(&s.transfers, t.id) {"
new = "            if !may_debit(actor, &a) && find_transfer(&s.transfers, t.id).is_none() {\n                Err(Error::Forbidden)\n            } else {\n                match find_transfer(&s.transfers, t.id) {"

# SEC-02: a user's principal must never count as an operator.
[[mutant]]
name = "user_acts_as_operator"
old = "        Actor::User(_) => false,\n        Actor::Operator(_) => true,"
new = "        Actor::User(_) => true,\n        Actor::Operator(_) => true,"

# SEC-02: the journal must record which operator posted.
[[mutant]]
name = "operator_id_dropped"
old = "Some(b) => post(actor, s, t, a, b, operator_of(actor)),"
new = "Some(b) => post(actor, s, t, a, b, 0),"

# F3: a page plan that skips a sequence number.
[[mutant]]
name = "page_plan_skips_one"
old = "    let mut x = from + 1;"
new = "    let mut x = from + 2;"

# F3: a user listing another owner's accounts.
[[mutant]]
name = "page_lists_other_owner"
old = "    if !is_operator(actor) && owner != user_of(actor) {\n        return Err(Error::Forbidden);\n    }\n    let end = page_end(from, limit);"
new = "    let end = page_end(from, limit);"

# G1: opening an account without its history entry.
[[mutant]]
name = "change_without_entry"
old = "four(Write::PutAccount(a), Write::PutHistory(h), Write::SetLedger(l2), Write::PutOwner(c2))"
new = "four(Write::PutAccount(a), Write::SetLedger(l2), Write::PutOwner(c2), Write::PutOwner(c2))"

# G1: the entry names the wrong actor (a user recorded as 0).
[[mutant]]
name = "history_wrong_actor"
old = "        actor: actor_id(actor),"
new = "        actor: operator_of(actor),"

# G1: the debit account's count of entries not bumped, so its next change overwrites this entry.
[[mutant]]
name = "history_entry_overwritten"
old = "                changes: a.changes + 1,"
new = "                changes: a.changes,"
