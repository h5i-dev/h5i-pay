[package]
name = "payment-api"
description = "h5i-pay: the HTTP server (axum on h5i-app) for the ledger, payments, webhooks and reconciliation"
edition.workspace = true
license.workspace = true
version.workspace = true
publish.workspace = true

[[bin]]
name = "h5i-pay"
path = "src/main.rs"

[features]
# `H5I_PAY_PSP=mock`: the Mock PSP. Off by default and in the production
# image, so a production binary cannot run with a PSP that accepts any token
# (SEC-05). Local development: `cargo run -p payment-api --features mock-psp`.
mock-psp = ["payment-connectors/mock"]

[dependencies]
h5i-app = { workspace = true, features = ["full"] }
h5i-app-core.workspace = true
h5i-app-pg.workspace = true
h5i-app-http.workspace = true
h5i-app-json.workspace = true
payment-ledger.workspace = true
payment-domain.workspace = true
payment-storage.workspace = true
payment-connectors.workspace = true
payment-reconcile.workspace = true
# File formats of the batch worker (export / ingest).
payment-batch.workspace = true
axum.workspace = true
tokio.workspace = true
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
sha2.workspace = true
futures-util = "0.3"
# G3: v2 tokens (HMAC-SHA256, base64url), OIDC/JWT signature checks
# (RS256, ES256) and JWKS fetches. ring is already in the tree (rustls).
hmac.workspace = true
base64 = "0.22"
ring = "0.17"
reqwest.workspace = true
hex.workspace = true
tokio-postgres = "0.7"

[dev-dependencies]
# tests/process_kill.rs: the h5i-pay binary against PostgreSQL and a fake Stripe.
reqwest.workspace = true
serde_urlencoded = "0.7"
tokio-postgres = "0.7"
