# Read by `h5i app` (extract, check, prove, mutate). Run from the repo root:
#   h5i app prove crates/payment-domain
[extract]
crate = "."
start-from = ["transition", "reads", "read_only", "policy::check"]
schema = true
include = ["h5i_app_sql"]

[proofs]
# The same Lake project as the ledger; extraction goes to proofs/generated/.
dir = "../../proofs/payments"

[check]
theorems = [
  "payment_domain.Theorems.status_steps_allowed",
  "payment_domain.Theorems.terminal_final",
  "payment_domain.Theorems.captured_final",
  "payment_domain.Theorems.refund_safety",
  "payment_domain.Theorems.refunded_le_captured",
  "payment_domain.Theorems.event_dedup",
  "payment_domain.Theorems.reachable_inv",
  # SEC-02: operators only, and every row names who wrote it.
  "payment_domain.Theorems.operator_only",
  "payment_domain.Theorems.writes_record_operator",
  # F2: the ledger-complete marker.
  "payment_domain.Theorems.marked_only_as_seen",
  "payment_domain.Theorems.changes_clear_ledger_done",
  # G1: one history entry per change, naming the caller; only appended.
  "payment_domain.Theorems.every_change_logged",
  "payment_domain.Theorems.history_appended",
  "payment_domain.Policies.check_sound",
  # Read plans (`reads`, `PaymentsStore::load_for`).
  "payment_domain.Plan.reads_abs",
  "payment_domain.Schema.decode_load",
  "payment_domain.Frame.frame",
  "payment_domain.Frame.load_for_sound",
  # G6: the read-only commands write nothing (h5i-app's obligation for
  # `Kernel::read_only`); only operators read a `Range` page.
  "payment_domain.ReadOnly.sound",
  "payment_domain.Theorems.range_operator",
  "payment_domain.Commands.view_writes",
]

# Bugs the proofs must reject (`h5i app mutate crates/payment-domain`).
[[mutant]]
name = "refund_past_capture"
old = "} else if p.refunded + (p.refund_pending + amount) > p.captured {"
new = "} else if p.refunded + (p.refund_pending + amount) > p.captured + 1 {"

[[mutant]]
name = "capture_beyond_authorization"
old = "if amount == 0 || amount > p.authorized {"
new = "if amount == 0 {"

[[mutant]]
name = "decline_after_capture"
old = "fn record_declined(p: Payment, op: u64) -> Outcome {\n    if p.status == PROCESSING {"
new = "fn record_declined(p: Payment, op: u64) -> Outcome {\n    if p.status == PROCESSING || p.status == CAPTURED {"

[[mutant]]
name = "webhook_not_deduplicated"
old = "Some(_) => Ok((Vec::new(), Reply::Duplicate)),"
new = "Some(_) => record(actor, s, id, result),"

[[mutant]]
name = "blocked_recipient_approved"
file = "src/policy.rs"
old = "if contains_linear(blocked, n_blocked, r.recipient) {"
new = "if false && contains_linear(blocked, n_blocked, r.recipient) {"

[[mutant]]
name = "refund_success_without_release"
old = "let p2 = with_refunds(p, p.refunded + r.amount, p.refund_pending - r.amount, op);"
new = "let p2 = with_refunds(p, p.refunded + r.amount, p.refund_pending, op);"

[[mutant]]
name = "record_plan_misses_refund"
old = "PspResult::RefundSucceeded { refund } => out.push(rd_where(T_REFUNDS, p_eq(REFUND_ID, v_int(*refund)))),"
new = "PspResult::RefundSucceeded { refund: _ } => {}"

[[mutant]]
name = "refunds_plan_reads_by_refund_id"
old = "Command::Refunds { payment } => {\n            out.push(rd_where(T_PAYMENTS, p_eq(PAYMENT_ID, v_int(*payment))));\n            out.push(rd_where(T_REFUNDS, p_eq(REFUND_PAYMENT, v_int(*payment))));"
new = "Command::Refunds { payment } => {\n            out.push(rd_where(T_PAYMENTS, p_eq(PAYMENT_ID, v_int(*payment))));\n            out.push(rd_where(T_REFUNDS, p_eq(REFUND_ID, v_int(*payment))));"

[[mutant]]
name = "view_plan_misses_reference"
old = "            out.push(rd_where(T_REFS, p_eq(REF_PAYMENT, v_int(*id))));\n        }\n        Command::MarkPosted"
new = "        }\n        Command::MarkPosted"

# SEC-02: a user's principal must never count as an operator.
[[mutant]]
name = "user_acts_as_operator"
old = "        Actor::User(_) => false,\n        Actor::Operator(_) => true,"
new = "        Actor::User(_) => true,\n        Actor::Operator(_) => true,"

# SEC-02: recorded PSP results must name the operator who recorded them.
[[mutant]]
name = "operator_id_dropped"
old = "    let op = operator_of(actor);\n    match find_payment(&s.payments, id) {"
new = "    let op = 0;\n    match find_payment(&s.payments, id) {"

# F2: marking a payment whose refunds the orchestrator did not see.
[[mutant]]
name = "mark_ignores_refunds"
old = "if p.captured == captured && covers(&rows, seen) && covers(seen, &rows) {"
new = "if p.captured == captured {"

# F2: a refund outcome that leaves the payment marked (recovery would skip it).
[[mutant]]
name = "refund_keeps_mark"
old = "        refunded,\n        refund_pending,\n        operator: op,\n        ledger_done: false,"
new = "        refunded,\n        refund_pending,\n        operator: op,\n        ledger_done: p.ledger_done,"

# F2: the mark's plan must load the payment's refunds (else it marks on none).
[[mutant]]
name = "mark_plan_misses_refunds"
old = "        Command::MarkPosted { payment, .. } => {\n            out.push(rd_where(T_PAYMENTS, p_eq(PAYMENT_ID, v_int(*payment))));\n            out.push(rd_where(T_REFUNDS, p_eq(REFUND_PAYMENT, v_int(*payment))));\n        }"
new = "        Command::MarkPosted { payment, .. } => {\n            out.push(rd_where(T_PAYMENTS, p_eq(PAYMENT_ID, v_int(*payment))));\n        }"

# F3: a page plan that skips a sequence number.
[[mutant]]
name = "page_plan_skips_one"
old = "    let mut x = from + 1;"
new = "    let mut x = from + 2;"

# F3: a merchant listing another merchant's payments.
[[mutant]]
name = "list_other_merchant"
old = "    if !is_operator(actor) && merchant != user_of(actor) {\n        return Err(Error::Forbidden);\n    }\n    let end = page_end(from, limit);"
new = "    let end = page_end(from, limit);"

# G1: a change that writes no history entry.
[[mutant]]
name = "change_without_entry"
old = "    out.push(Write::PutHistory(h));\n"
new = "    let _ = h;\n"

# G1: the entry names the wrong actor (a user recorded as 0).
[[mutant]]
name = "history_wrong_actor"
old = "        actor: actor_id(actor),"
new = "        actor: operator_of(actor),"

# G1: the count of entries not bumped, so the next change overwrites this entry.
[[mutant]]
name = "history_entry_overwritten"
old = "let after = changed(base, operator_of(actor), done, n + 1);"
new = "let after = changed(base, operator_of(actor), done, n);"

# G6: the RefundRange plan without the payments of the page's refunds.
[[mutant]]
name = "range_plan_misses_refund_payments"
old = "                    out.push(rd_where(T_PAYMENTS, parents));\n"
new = ""

# G6: a merchant reading the tenant's Range pages.
[[mutant]]
name = "range_open_to_users"
old = "    if !is_operator(actor) {\n        return Err(Error::Forbidden);\n    }\n    let end = page_end(from, limit);\n    let next = if end < s.counter.next_id { Some(end) } else { None };\n    Ok((Vec::new(), Reply::Range(payment_ids"
new = "    if false {\n        return Err(Error::Forbidden);\n    }\n    let end = page_end(from, limit);\n    let next = if end < s.counter.next_id { Some(end) } else { None };\n    Ok((Vec::new(), Reply::Range(payment_ids"

# G6: a write declared read-only.
[[mutant]]
name = "create_declared_read_only"
old = "            | Command::RefundRange { .. }\n    )"
new = "            | Command::RefundRange { .. }\n            | Command::Create { .. }\n    )"
