# Read by `h5i app` (extract, check, prove, mutate). Run from the repo root:
#   h5i app prove crates/payment-domain
[extract]
crate = "."
start-from = ["transition", "reads", "policy::check"]
schema = true
include = ["h5i_app_sql"]

[proofs]
# The same Lake project as the ledger; extraction goes to proofs/generated/.
dir = "../../proofs/payments"

[check]
theorems = [
  "payment_domain.Theorems.status_steps_allowed",
  "payment_domain.Theorems.terminal_final",
  "payment_domain.Theorems.captured_final",
  "payment_domain.Theorems.refund_safety",
  "payment_domain.Theorems.refunded_le_captured",
  "payment_domain.Theorems.event_dedup",
  "payment_domain.Theorems.reachable_inv",
  # SEC-02: operators only, and every row names who wrote it.
  "payment_domain.Theorems.operator_only",
  "payment_domain.Theorems.writes_record_operator",
  "payment_domain.Policies.check_sound",
  # Read plans (`reads`, `PaymentsStore::load_for`).
  "payment_domain.Plan.reads_abs",
  "payment_domain.Schema.decode_load",
  "payment_domain.Frame.frame",
  "payment_domain.Frame.load_for_sound",
  "payment_domain.Commands.view_writes",
]

# Bugs the proofs must reject (`h5i app mutate crates/payment-domain`).
[[mutant]]
name = "refund_past_capture"
old = "} else if p.refunded + (p.refund_pending + amount) > p.captured {"
new = "} else if p.refunded + (p.refund_pending + amount) > p.captured + 1 {"

[[mutant]]
name = "capture_beyond_authorization"
old = "if amount == 0 || amount > p.authorized {"
new = "if amount == 0 {"

[[mutant]]
name = "decline_after_capture"
old = "fn record_declined(p: Payment, op: u64) -> Outcome {\n    if p.status == PROCESSING {"
new = "fn record_declined(p: Payment, op: u64) -> Outcome {\n    if p.status == PROCESSING || p.status == CAPTURED {"

[[mutant]]
name = "webhook_not_deduplicated"
old = "Some(_) => Ok((Vec::new(), Reply::Duplicate)),"
new = "Some(_) => record(actor, s, id, result),"

[[mutant]]
name = "blocked_recipient_approved"
file = "src/policy.rs"
old = "if contains_linear(blocked, n_blocked, r.recipient) {"
new = "if false && contains_linear(blocked, n_blocked, r.recipient) {"

[[mutant]]
name = "refund_success_without_release"
old = "let p2 = with_refunds(p, p.refunded + r.amount, p.refund_pending - r.amount, op);"
new = "let p2 = with_refunds(p, p.refunded + r.amount, p.refund_pending, op);"

[[mutant]]
name = "record_plan_misses_refund"
old = "PspResult::RefundSucceeded { refund } => out.push(rd_where(T_REFUNDS, p_eq(REFUND_ID, v_int(*refund)))),"
new = "PspResult::RefundSucceeded { refund: _ } => {}"

[[mutant]]
name = "refunds_plan_reads_by_refund_id"
old = "out.push(rd_where(T_REFUNDS, p_eq(REFUND_PAYMENT, v_int(*payment))));"
new = "out.push(rd_where(T_REFUNDS, p_eq(REFUND_ID, v_int(*payment))));"

[[mutant]]
name = "view_plan_misses_reference"
old = "            out.push(rd_where(T_REFS, p_eq(REF_PAYMENT, v_int(*id))));\n        }\n    }\n    Some(out)"
new = "        }\n    }\n    Some(out)"

# SEC-02: a user's principal must never count as an operator.
[[mutant]]
name = "user_acts_as_operator"
old = "        Actor::User(_) => false,\n        Actor::Operator(_) => true,"
new = "        Actor::User(_) => true,\n        Actor::Operator(_) => true,"

# SEC-02: recorded PSP results must name the operator who recorded them.
[[mutant]]
name = "operator_id_dropped"
old = "    let op = operator_of(actor);\n    match find_payment(&s.payments, id) {"
new = "    let op = 0;\n    match find_payment(&s.payments, id) {"
