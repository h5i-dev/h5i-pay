[package]
name = "payment-storage"
description = "h5i-pay: PostgreSQL adapters (h5i-app Store/Kernel/codec) for the ledger and payment kernels"
edition.workspace = true
license.workspace = true
version.workspace = true
publish.workspace = true

[features]
# Test-only hooks of h5i-app-pg (Tx::backend_pid), for fault injection.
testing = ["h5i-app-pg/testing"]

[dependencies]
h5i-app = { workspace = true, features = ["full"] }
# `schema!`'s server-side mapping expands to paths through these two.
h5i-app-core.workspace = true
h5i-app-pg = { workspace = true, features = ["tls"] }
h5i-app-http.workspace = true
h5i-app-json.workspace = true
payment-ledger.workspace = true
payment-domain.workspace = true
axum.workspace = true
serde.workspace = true
serde_json.workspace = true
# One cross-tenant read for scheduled recovery (`tenants_to_recover`), on
# the same tokio-postgres h5i-app-pg uses.
tokio-postgres = "0.7"
tokio.workspace = true
