[package]
name = "h5i-pay-benchmarks"
description = "h5i-pay: CPU single-thread / CPU multithread / SIMD / GPU benchmarks for reconciliation and batch policy validation"
edition.workspace = true
license.workspace = true
version.workspace = true
publish.workspace = true

[[bin]]
name = "bench"
path = "src/main.rs"

# End-to-end through PostgreSQL (API, recovery, reconciliation): src/bin/e2e.rs.
[[bin]]
name = "e2e"
path = "src/bin/e2e.rs"

[features]
gpu = ["payment-gpu/cuda"]

[dependencies]
h5i-app-gpu.workspace = true
payment-batch.workspace = true
payment-gpu.workspace = true
payment-reconcile.workspace = true
payment-domain.workspace = true
serde_json.workspace = true
rayon.workspace = true
h5i-app-core.workspace = true
h5i-app-pg.workspace = true
payment-api.workspace = true
payment-storage.workspace = true
payment-connectors = { workspace = true, features = ["mock"] }
tokio.workspace = true
axum.workspace = true
reqwest.workspace = true
tokio-postgres = "0.7"
