[workspace]
resolver = "3"
members = [
    "crates/payment-ledger",
    "crates/payment-domain",
    "crates/payment-storage",
    "crates/payment-connectors",
    "crates/payment-api",
    "crates/payment-reconcile",
    "crates/payment-batch",
    "crates/payment-gpu",
    "benchmarks",
    "tests",
]

[workspace.package]
edition = "2024"
license = "Apache-2.0"
version = "0.1.0"
publish = false
repository = "https://github.com/h5i-dev/h5i-pay"

[workspace.dependencies]
# Every h5i-app crate, and `h5i_app_lib` in proofs/*/lakefile.lean, from one
# commit of github.com/h5i-dev/h5i: branch `app/pipeline-errors` (9ec26b5,
# I1: pipelined statements report the error that failed the transaction),
# not merged yet, one commit on main 3ab10b3 (h5i-app 0.5.3), which has
# range comparisons in reads (PR #775, 7b91863) and H1 (PR #773). Once it is
# merged, pin the main commit; once h5i-app is released with it, go back to
# a crates.io version.
h5i-app = { git = "https://github.com/h5i-dev/h5i", rev = "9ec26b510cbcbbe0bea703e63239b0e6a515e33d" }
h5i-app-core = { git = "https://github.com/h5i-dev/h5i", rev = "9ec26b510cbcbbe0bea703e63239b0e6a515e33d" }
h5i-app-pg = { git = "https://github.com/h5i-dev/h5i", rev = "9ec26b510cbcbbe0bea703e63239b0e6a515e33d" }
h5i-app-http = { git = "https://github.com/h5i-dev/h5i", rev = "9ec26b510cbcbbe0bea703e63239b0e6a515e33d" }
h5i-app-json = { git = "https://github.com/h5i-dev/h5i", rev = "9ec26b510cbcbbe0bea703e63239b0e6a515e33d" }
h5i-app-schema = { git = "https://github.com/h5i-dev/h5i", rev = "9ec26b510cbcbbe0bea703e63239b0e6a515e33d" }
h5i-app-sql = { git = "https://github.com/h5i-dev/h5i", rev = "9ec26b510cbcbbe0bea703e63239b0e6a515e33d" }
h5i-app-gpu = { git = "https://github.com/h5i-dev/h5i", rev = "9ec26b510cbcbbe0bea703e63239b0e6a515e33d" }

payment-ledger = { path = "crates/payment-ledger" }
payment-domain = { path = "crates/payment-domain" }
payment-storage = { path = "crates/payment-storage" }
payment-connectors = { path = "crates/payment-connectors" }
payment-api = { path = "crates/payment-api" }
payment-reconcile = { path = "crates/payment-reconcile" }
payment-batch = { path = "crates/payment-batch" }
payment-gpu = { path = "crates/payment-gpu" }

axum = "0.8"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time", "signal", "sync"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
rayon = "1"
hmac = "0.12"
sha2 = "0.10"
hex = "0.4"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }

[profile.release]
debug = 1

[profile.bench]
debug = 1
