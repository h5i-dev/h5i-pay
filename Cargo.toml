[workspace]
resolver = "3"
members = [
    "crates/payment-ledger",
    "crates/payment-domain",
    "crates/payment-storage",
    "crates/payment-connectors",
    "crates/payment-api",
    "crates/payment-reconcile",
    "crates/payment-batch",
    "crates/payment-gpu",
    "benchmarks",
    "tests",
]

[workspace.package]
edition = "2024"
license = "Apache-2.0"
version = "0.1.0"
publish = false
repository = "https://github.com/h5i-dev/h5i-pay"

[workspace.dependencies]
# Every h5i-app crate from one commit of github.com/h5i-dev/h5i (main after
# #769, Lean lemmas for u32 schema columns, and #770, h5i-app-pg `tls`).
# The crates there are still version 0.1.4 and are not on crates.io.
# Keep this rev, crates/payment-gpu's backend-nvvm rev and the
# `h5i_app_lib` require in proofs/*/lakefile.lean identical.
h5i-app = { git = "https://github.com/h5i-dev/h5i", rev = "a19667cbbb5a1be14c8d16579eb00e679910dc57" }
h5i-app-core = { git = "https://github.com/h5i-dev/h5i", rev = "a19667cbbb5a1be14c8d16579eb00e679910dc57" }
h5i-app-pg = { git = "https://github.com/h5i-dev/h5i", rev = "a19667cbbb5a1be14c8d16579eb00e679910dc57" }
h5i-app-http = { git = "https://github.com/h5i-dev/h5i", rev = "a19667cbbb5a1be14c8d16579eb00e679910dc57" }
h5i-app-json = { git = "https://github.com/h5i-dev/h5i", rev = "a19667cbbb5a1be14c8d16579eb00e679910dc57" }
h5i-app-schema = { git = "https://github.com/h5i-dev/h5i", rev = "a19667cbbb5a1be14c8d16579eb00e679910dc57" }
h5i-app-sql = { git = "https://github.com/h5i-dev/h5i", rev = "a19667cbbb5a1be14c8d16579eb00e679910dc57" }
h5i-app-gpu = { git = "https://github.com/h5i-dev/h5i", rev = "a19667cbbb5a1be14c8d16579eb00e679910dc57" }

payment-ledger = { path = "crates/payment-ledger" }
payment-domain = { path = "crates/payment-domain" }
payment-storage = { path = "crates/payment-storage" }
payment-connectors = { path = "crates/payment-connectors" }
payment-api = { path = "crates/payment-api" }
payment-reconcile = { path = "crates/payment-reconcile" }
payment-batch = { path = "crates/payment-batch" }
payment-gpu = { path = "crates/payment-gpu" }

axum = "0.8"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time", "signal", "sync"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
rayon = "1"
hmac = "0.12"
sha2 = "0.10"
hex = "0.4"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }

[profile.release]
debug = 1

[profile.bench]
debug = 1
